<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#EAE6DF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Aide</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/app.css">
    <style>
    /* ── Background Jobs — card layout ──────────────────────────────── */

    .jc-budget { margin-bottom:20px; }
    .jc-budget-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
    .jc-budget-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--ink3); }
    .jc-budget-amount { font-family:var(--mono); font-size:11px; color:var(--ink3); }
    .jc-budget-exhausted { color:var(--red); font-weight:700; margin-left:8px; }
    .jc-budget-track { height:4px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
    .jc-budget-fill  { height:100%; border-radius:99px; transition:width .4s ease; }

    .jc-grid {
        display:grid;
        grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
        gap:12px;
    }

    .jc-card {
        background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
        padding:16px; display:flex; flex-direction:column; gap:12px;
        transition:border-color .15s;
    }
    .jc-card:hover { border-color:var(--ink4); }
    .jc-card--paused { opacity:.6; }

    .jc-card-header { display:flex; align-items:flex-start; gap:11px; }
    .jc-icon {
        width:36px; height:36px; border-radius:10px; flex-shrink:0;
        display:flex; align-items:center; justify-content:center;
        font-family:var(--mono); font-size:14px; font-weight:700;
    }
    .jc-card-info { flex:1; min-width:0; }
    .jc-name { font-size:13px; font-weight:600; color:var(--ink); }
    .jc-desc { font-size:11px; color:var(--ink3); margin-top:2px; line-height:1.45; }

    .jc-status {
        flex-shrink:0; margin-top:2px;
        font-family:var(--mono); font-size:9px; font-weight:700;
        text-transform:uppercase; letter-spacing:.06em;
        padding:2px 7px; border-radius:99px; border:1.5px solid;
    }
    .jc-status--active   { color:var(--green); border-color:var(--green); background:var(--green-bg,#1a2e1a); }
    .jc-status--paused   { color:var(--ink4);  border-color:var(--border); background:transparent; }
    .jc-status--inactive { color:var(--ink4);  border-color:var(--border); background:transparent; }

    .jc-meta { display:flex; flex-direction:column; gap:2px; }
    .jc-sched-text,
    .jc-lastrun-text { font-family:var(--mono); font-size:10px; color:var(--ink3); }

    .jc-actions { display:flex; gap:6px; flex-wrap:wrap; }

    .jc-btn {
        font-family:var(--mono); font-size:10px; font-weight:600;
        text-transform:uppercase; letter-spacing:.03em;
        padding:5px 11px; border-radius:var(--r-sm); border:1.5px solid;
        cursor:pointer; transition:all .12s; white-space:nowrap;
        display:inline-flex; align-items:center; gap:4px;
    }
    .jc-btn--run { background:var(--ink); color:var(--surface); border-color:var(--ink); }
    .jc-btn--run:hover:not(:disabled) { opacity:.75; }
    .jc-btn--run:disabled { opacity:.45; cursor:default; }
    .jc-btn--outline { background:transparent; color:var(--ink2); border-color:var(--border); }
    .jc-btn--outline:hover { border-color:var(--ink3); color:var(--ink); }
    .jc-btn--outline-active { border-color:var(--accent); color:var(--accent); }

    /* Inline schedule editor */
    .jc-freq-panel {
        border-top:1px solid var(--border); padding-top:12px;
        display:flex; flex-direction:column; gap:10px;
    }
    .jc-freq-row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    .jc-freq-select {
        font-family:var(--sans); font-size:12px; padding:5px 8px;
        border:1.5px solid var(--border); border-radius:var(--r-sm);
        background:var(--surface); color:var(--ink); outline:none; cursor:pointer;
    }
    .jc-freq-select:focus { border-color:var(--accent); }
    .jc-freq-num {
        font-family:var(--mono); font-size:12px; padding:5px 6px; width:52px; text-align:center;
        border:1.5px solid var(--border); border-radius:var(--r-sm);
        background:var(--surface); color:var(--ink); outline:none;
    }
    .jc-freq-time { width:40px; }
    .jc-freq-num:focus { border-color:var(--accent); }
    .jc-freq-at { font-family:var(--mono); font-size:11px; color:var(--ink3); }
    .jc-freq-footer { display:flex; justify-content:flex-end; gap:6px; }
    .jc-freq-save {
        font-family:var(--mono); font-size:10px; font-weight:600; text-transform:uppercase;
        letter-spacing:.04em; padding:5px 14px; border-radius:var(--r-sm); cursor:pointer;
        background:var(--ink); color:var(--surface); border:1.5px solid var(--ink);
    }
    .jc-freq-save:hover { opacity:.8; }
    .jc-freq-cancel {
        font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.04em;
        padding:5px 10px; border-radius:var(--r-sm); cursor:pointer;
        background:transparent; color:var(--ink3); border:1.5px solid var(--border);
    }
    .jc-freq-cancel:hover { border-color:var(--ink3); color:var(--ink); }
    </style>
</head>
<body>
<div class="app">

    <!-- ── Masthead ─────────────────────────────────────────────────────────── -->
    <header class="masthead">
        <div class="masthead-date" id="masthead-date"></div>
        <div class="masthead-right">
            <span class="masthead-user" id="masthead-user"></span>
            <button class="masthead-theme-btn" id="theme-toggle-btn" aria-label="Toggle theme">☾</button>
            <button class="masthead-sync-btn" id="sync-btn">↻ Sync</button>
        </div>
    </header>

    <!-- ── Sidenav ──────────────────────────────────────────────────────────── -->
    <nav class="sidenav">
        <div class="sidenav-brand">aide</div>
        <div class="nav-section">
            <div class="nav-item active" data-view="calendar">
                <span class="nav-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="12" rx="2"/><path d="M1.5 6.5h13"/><path d="M5 1v3M11 1v3"/></svg></span>
                Today
            </div>
            <div class="nav-item" data-view="dashboard">
                <span class="nav-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.5"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.5"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.5"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.5"/></svg></span>
                Overview
            </div>
            <div class="nav-item" data-view="digests" id="nav-digests">
                <span class="nav-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5h12M2 8h8M2 12.5h10"/></svg></span>
                Digests <span class="nav-badge-gray" id="badge-digests"></span>
            </div>
        </div>
        <div class="nav-section">
            <div class="nav-item" data-view="jobs">
                <span class="nav-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5l2 1.5"/></svg></span>
                Jobs
            </div>
        </div>
        <div class="nav-section">
            <div class="nav-label">Account</div>
            <div class="nav-item" data-view="settings">
                <span class="nav-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="6" r="2.5"/><path d="M2.5 13.5c0-3.038 2.462-5.5 5.5-5.5s5.5 2.462 5.5 5.5"/></svg></span>
                Google
            </div>
        </div>
    </nav>

    <!-- ── Main content ─────────────────────────────────────────────────────── -->
    <main class="main">

        <!-- Calendar / Today view — PRIMARY -->
        <div class="view active" id="view-calendar">
            <div class="cal-toolbar">
                <div class="cal-nav-group">
                    <button class="cal-nav-btn" id="cal-prev-btn">‹</button>
                    <span class="cal-month-label" id="cal-month-label"></span>
                    <button class="cal-nav-btn" id="cal-next-btn">›</button>
                </div>
                <div class="cal-toolbar-right">
                    <span class="section-count" id="calendar-count"></span>
                    <button class="section-action" id="sync-calendar-btn">↻ Sync</button>
                </div>
            </div>
            <div class="cal-month-grid">
                <div id="cal-grid-header" class="cal-grid-header"></div>
                <div id="cal-grid" class="cal-grid"></div>
            </div>

            <!-- Day panel: Schedule | Meals | Focus -->
            <div class="cal-day-panel" id="cal-day-panel">
                <div class="placeholder-row"><span class="spinner"></span></div>
            </div>
        </div>

        <!-- Overview / Dashboard view -->
        <div class="view" id="view-dashboard">

            <!-- Metric strip -->
            <div class="metric-strip">
                <div class="metric-card">
                    <div class="metric-value" id="m-today">—</div>
                    <div class="metric-label">Events today</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="m-week">—</div>
                    <div class="metric-label">This week</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="m-digests">—</div>
                    <div class="metric-label">Digests</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value metric-value--ts" id="m-sync">—</div>
                    <div class="metric-label">Last sync</div>
                </div>
            </div>

            <!-- Two-column body -->
            <div class="dash-grid">
                <div>
                    <div class="section-head">
                        <div class="section-title">Schedule</div>
                        <button class="section-action" id="dash-cal-link">all events →</button>
                    </div>
                    <div id="dash-schedule">
                        <div class="placeholder-row"><span class="spinner"></span></div>
                    </div>
                </div>
                <div>
                    <div class="section-head">
                        <div class="section-title">Recent Digests</div>
                        <button class="section-action" id="dash-digests-link">all →</button>
                    </div>
                    <div id="dash-digests">
                        <div class="placeholder-row"><span class="spinner"></span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Digests view -->
        <div class="view" id="view-digests">
            <div class="section-head">
                <div class="section-title">Digests</div>
                <div class="section-count" id="digests-count"></div>
                <button class="section-action" id="sync-digests-btn">↻ Sync</button>
            </div>
            <div id="digests-list">
                <div class="placeholder-row"><span class="spinner"></span></div>
            </div>
        </div>

        <!-- Jobs view -->
        <div class="view" id="view-jobs">
            <div class="section-head">
                <div class="section-title">Background Jobs</div>
            </div>

            <div id="jobs-budget-bar"></div>

            <div class="jc-grid" id="jobs-cards">
                <div class="placeholder-row"><span class="spinner"></span></div>
            </div>
        </div>

        <!-- Settings view -->
        <div class="view" id="view-settings">
            <div class="section-head"><div class="section-title">Google Account</div></div>
            <div id="google-status-block" style="font-family:var(--mono);font-size:12px;color:var(--ink3);margin-bottom:20px">
                Checking connection…
            </div>
            <div style="display:flex;gap:12px;flex-wrap:wrap">
                <a href="/integrations/google/auth" class="settings-btn-primary">Reconnect Google →</a>
                <button id="signout-btn" class="settings-btn-ghost">Sign out</button>
            </div>
        </div>

        <!-- Event detail view -->
        <div class="view" id="view-event">
            <div class="email-detail-header">
                <button class="back-btn" id="event-back-btn">← Back</button>
            </div>
            <div class="email-detail-subject" id="event-detail-title"></div>
            <div class="event-detail-time" id="event-detail-time"></div>
            <div class="event-detail-fields" id="event-detail-fields"></div>
        </div>

        <!-- Email detail view -->
        <div class="view" id="view-email">
            <div class="email-detail-header">
                <button class="back-btn" id="email-back-btn">← Back</button>
            </div>
            <div class="email-detail-subject" id="email-detail-subject"></div>
            <div class="email-detail-meta" id="email-detail-meta"></div>
            <div class="email-detail-body" id="email-detail-body"></div>
        </div>

    </main>

    <!-- ── Mobile bottom nav ─────────────────────────────────────────────── -->
    <nav class="bottom-nav" aria-label="Main navigation">
        <div class="nav-item active" data-view="calendar">
            <span class="nav-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="12" rx="2"/><path d="M1.5 6.5h13"/><path d="M5 1v3M11 1v3"/></svg></span>
            <span class="bottom-nav-label">Today</span>
        </div>
        <div class="nav-item" data-view="dashboard">
            <span class="nav-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.5"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.5"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.5"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.5"/></svg></span>
            <span class="bottom-nav-label">Overview</span>
        </div>
        <div class="nav-item" data-view="digests">
            <span class="nav-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5h12M2 8h8M2 12.5h10"/></svg></span>
            <span class="bottom-nav-label">Digests</span>
        </div>
        <div class="nav-item" data-view="jobs">
            <span class="nav-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5l2 1.5"/></svg></span>
            <span class="bottom-nav-label">Jobs</span>
        </div>
        <div class="nav-item" data-view="settings">
            <span class="nav-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="6" r="2.5"/><path d="M2.5 13.5c0-3.038 2.462-5.5 5.5-5.5s5.5 2.462 5.5 5.5"/></svg></span>
            <span class="bottom-nav-label">Google</span>
        </div>
    </nav>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
